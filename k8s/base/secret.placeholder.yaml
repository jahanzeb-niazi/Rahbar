# Documents the Secret's shape only. NEVER list this file in kustomization.yaml: applying it
# would overwrite the real Secret. ollama-host mode needs no key, so the api mounts this
# Secret as optional. If a key is ever needed, create it from the command line:
#   export LLM_API_KEY=...   then   make secret
# which runs: kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY=...
# Base64 in a Secret is encoding, not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
