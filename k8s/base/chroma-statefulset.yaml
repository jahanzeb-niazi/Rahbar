# The vector store. A StatefulSet, not a Deployment (docs/ARCHITECTURE.md): its PVC comes
# from volumeClaimTemplates, so the claim is bound to the pod identity chroma-0 and survives
# deletion and rescheduling, and a rollout never starts a second pod on the same volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
  labels:
    app: chroma
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
    spec:
      serviceAccountName: chroma
      enableServiceLinks: false     # else CHROMA_PORT=tcp://... from the Service crashes the server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12      # same version as chromadb-client in api/indexer
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: PERSIST_DIRECTORY
              value: /data
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: chroma-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
