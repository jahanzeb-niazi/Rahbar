apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ragops
  namespace: rahbar
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ragops-eval
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      ragops-role: eval
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - {port: 8000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ragops-eval-ingress
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              ragops-role: eval
      ports:
        - {port: 8000, protocol: TCP}
