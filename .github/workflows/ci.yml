name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: ruff
        run: ruff check api indexer eval corpus
      - name: mypy
        run: |
          (cd api && mypy app)
          (cd indexer && mypy pipeline)

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: pytest (stub provider, no network, no model)
        run: |
          (cd api && pytest -q --cov=app --cov-report=term --cov-fail-under=60)
          (cd indexer && pytest -q --cov=pipeline --cov-report=term --cov-fail-under=60)

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install kustomize and kubeconform
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin kustomize
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: kustomize build | kubeconform -strict
        run: |
          for overlay in prod dev; do
            kustomize build k8s/overlays/$overlay | kubeconform -strict -summary -kubernetes-version 1.32.0
          done

  build:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build images (not pushed)
        run: |
          docker build -t rahbar-api:dev api
          docker build -t rahbar-ui:dev ui
          docker build -t rahbar-indexer:dev -f indexer/Dockerfile .
          docker save rahbar-api:dev rahbar-ui:dev rahbar-indexer:dev | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

  scan:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [rahbar-api, rahbar-ui, rahbar-indexer]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: images
      - run: gunzip -c images.tar.gz | docker load
      - name: trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  e2e-eval:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install httpx==0.28.1 pyyaml==6.0.2
      - uses: actions/download-artifact@v4
        with:
          name: images
      - name: kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind
          config: .github/kind-config.yaml
      - name: load images into kind
        run: |
          gunzip -c images.tar.gz > images.tar
          kind load image-archive images.tar --name kind
      - name: deploy, index the fixture corpus, wait for rollout
        run: bash scripts/e2e-up.sh k8s/overlays/dev
      - name: eval gate (section 5.4)
        run: |
          python eval/run_eval.py --api http://localhost --host rahbar.local \
            --golden eval/fixtures/golden.fixture.yaml \
            --baseline eval/fixtures/baseline.json \
            --out eval/fixtures/results.json
      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n rahbar || true
          kubectl logs -n rahbar deployment/api --tail=100 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-eval-results
          path: eval/fixtures/results.json
          if-no-files-found: ignore
