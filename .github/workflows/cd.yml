name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: ruff check api indexer eval corpus
      - name: pytest
        run: |
          (cd api && pytest -q --cov=app --cov-fail-under=60)
          (cd indexer && pytest -q --cov=pipeline --cov-fail-under=60)

  build-push:
    runs-on: ubuntu-24.04
    needs: test                     # never publish an image built from failing code
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}     # a Docker Hub access token, not a password
      - name: api
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
      - name: ui
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
      - name: indexer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: indexer/Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}

  deploy:
    runs-on: ubuntu-24.04
    needs: build-push               # deploy only what was just tested and published
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: kind cluster (ephemeral)
        uses: helm/kind-action@v1
        with:
          cluster_name: kind
          config: .github/kind-config.yaml
      - name: pin the prod overlay to this commit's images (never :latest)
        working-directory: k8s/overlays/prod
        run: |
          for app in api ui indexer; do
            kustomize edit set image \
              "rahbar-$app=docker.io/${REGISTRY_USER}/rahbar-$app:${{ github.sha }}"
          done
          grep -A2 "name: rahbar-" kustomization.yaml
      - name: deploy, index, kubectl rollout status
        run: bash scripts/e2e-up.sh k8s/overlays/prod
      - name: smoke test through the Ingress
        run: |
          set -euo pipefail
          # Save the page first: piping curl into `grep -q` makes grep exit at the first
          # match, curl then fails writing the rest (exit 23), and pipefail fails the step.
          curl -fsS -H "Host: rahbar.local" -o index.html http://localhost/
          grep -qi "rahbar" index.html
          curl -fsS -H "Host: rahbar.local" -H "Content-Type: application/json" \
            -d '{"question": "When is a student placed on academic warning?"}' \
            http://localhost/api/ask | tee answer.json
          python3 -c "import json; r = json.load(open('answer.json')); assert r['retrieved'], r"
          echo "running images:"
          kubectl get deploy -n rahbar -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{..image}{"\n"}{end}'
      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n rahbar || true
          kubectl describe pods -n rahbar | tail -80 || true
